<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:"
    />
    <title>Terminal</title>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="bar">
      <span class="title">Terminal</span>
      <span class="chip" id="chip" data-state="checking">
        <span class="dot"></span><span id="chip-text">Checking Claude Code…</span>
      </span>
      <button class="primary" id="btn-install" hidden>Install Claude Code</button>
      <button class="primary" id="btn-login" hidden>Sign in to Claude</button>
      <button id="btn-check" hidden>Check again</button>
      <span class="grow"></span>
      <button class="icon" id="btn-restart" title="New shell">↻</button>
      <button class="icon" id="btn-expand" title="Make bigger">▴</button>
      <button class="icon" id="btn-hide" title="Hide terminal (Ctrl+`)">✕</button>
    </header>
    <div class="note" id="note" hidden></div>
    <div id="term"></div>
    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
